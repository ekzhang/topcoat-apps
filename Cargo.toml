[package]
name = "topcoat-apps"
version = "0.1.0"
edition = "2024"

[dependencies]
fftw = { version = "0.8.0", default-features = false, features = ["system"] }
rustfft = "6.4.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.4.0", features = [
    "font-fontsource",
    "tailwind",
    "ui",
] }

[build-dependencies]
topcoat = { version = "0.4.0", default-features = false, features = [
    "tailwind",
] }
